services:
  - type: web
    name: fund-manager-monitor
    env: python
    region: oregon
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_NAME
        value: Fund Manager Monitor API
      - key: DEBUG
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        value: sqlite:///./fund_manager_monitor.db
      - key: SCRAPING_SCHEDULE_HOUR
        value: 8
      - key: SCRAPING_SCHEDULE_MINUTE
        value: 0
